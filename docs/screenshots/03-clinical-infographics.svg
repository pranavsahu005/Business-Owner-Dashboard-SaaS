  </defs>
  <rect width="1280" height="720" rx="22" fill="#F6F2EA"/>

  <!-- Top Header -->
  <text x="54" y="68" fill="#1D1B19" font-family="Georgia, serif" font-size="28" font-weight="700">Clinical Infographics &amp; Operational Telemetry</text>
  <text x="54" y="92" fill="#7A7167" font-family="Inter, sans-serif" font-size="13">D3 segmented channel mix, semi-circle collection gauge, warm capacity allocation bar, and interactive session timer</text>

  <!-- Practice Utilization Strip -->
  <rect x="54" y="122" width="1172" height="142" rx="24" fill="#FFFEFC" stroke="#EAE3D7"/>
