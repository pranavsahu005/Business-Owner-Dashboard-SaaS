  <text x="660" y="234" fill="#4E4740" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">26%</text>

  <text x="1032" y="206" fill="#8C8378" font-family="Inter, sans-serif" font-size="11">Buffer</text>
  <rect x="1032" y="214" width="164" height="32" rx="16" fill="#FFFEFC" stroke="#E4DCCF"/>
  <text x="1100" y="234" fill="#5E564E" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">12%</text>

