  <line x1="483" y1="564" x2="797" y2="564" stroke="#F0E9DF"/>
  <text x="483" y="600" fill="#7A7167" font-family="Inter, sans-serif" font-size="13">Payments Received</text>
  <text x="720" y="600" fill="#5B8A72" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">$71,480</text>
  <text x="483" y="636" fill="#7A7167" font-family="Inter, sans-serif" font-size="13">Pending Claims</text>
  <text x="720" y="636" fill="#C87D55" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">$19,670</text>

  <!-- Card 3: Interactive Consultation Timer -->
  <rect x="852" y="290" width="374" height="384" rx="24" fill="#FFFEFC" stroke="#EAE3D7"/>
  <text x="882" y="330" fill="#1D1B19" font-family="Georgia, serif" font-size="18" font-weight="700">Session Time Tracker</text>
  <text x="1152" y="330" fill="#6D9E83" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Active</text>

  <g transform="translate(1039, 468)">
    <circle r="76" fill="none" stroke="#EFEAE1" stroke-width="11" stroke-dasharray="4 7"/>
    <circle r="76" fill="none" stroke="#E8C46A" stroke-width="11" stroke-linecap="round" stroke-dasharray="290 478" transform="rotate(-90)"/>
    <text y="4" text-anchor="middle" fill="#1D1B19" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="700">02:35</text>
    <text y="26" text-anchor="middle" fill="#8C8378" font-family="Inter, sans-serif" font-size="12">Consult Time</text>
  </g>

  <rect x="964" y="592" width="110" height="38" rx="19" fill="#F3D37A"/>
  <text x="998" y="616" fill="#2B2313" font-family="Inter, sans-serif" font-size="13" font-weight="700">Pause</text>
  <circle cx="1098" cy="611" r="19" fill="#FFFEFC" stroke="#E6DFD4"/>
  <text x="1093" y="615" fill="#5E564E" font-family="Inter, sans-serif" font-size="13">↺</text>
