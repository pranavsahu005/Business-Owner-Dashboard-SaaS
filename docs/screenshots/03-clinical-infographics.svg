  <text x="84" y="177" fill="#8C8378" font-family="Inter, sans-serif" font-size="12">Real-time operational distribution across active clinical workflows</text>
  <text x="1038" y="162" fill="#1D1B19" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">638 Visits · $143 Avg Yield</text>

  <text x="84" y="206" fill="#8C8378" font-family="Inter, sans-serif" font-size="11">In-Clinic</text>
  <rect x="84" y="214" width="286" height="32" rx="16" fill="#171614"/>
  <text x="104" y="234" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">34%</text>

  <text x="382" y="206" fill="#8C8378" font-family="Inter, sans-serif" font-size="11">Telehealth</text>
  <rect x="382" y="214" width="246" height="32" rx="16" fill="#F3D37A"/>
  <text x="402" y="234" fill="#2B2313" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">28%</text>

  <text x="640" y="206" fill="#8C8378" font-family="Inter, sans-serif" font-size="11">Insurance Processing</text>
