  <text x="84" y="330" fill="#1D1B19" font-family="Georgia, serif" font-size="18" font-weight="700">Clinical Channel Mix</text>
  <text x="348" y="330" fill="#9A9186" font-family="'JetBrains Mono', monospace" font-size="11">D3 Arc</text>

  <g transform="translate(241, 444)">
    <circle r="70" fill="none" stroke="#1A1918" stroke-width="24" stroke-dasharray="168 440" transform="rotate(-90)"/>
    <circle r="70" fill="none" stroke="#6D9E83" stroke-width="24" stroke-dasharray="122 440" transform="rotate(56)"/>
    <circle r="70" fill="none" stroke="#E5C167" stroke-width="24" stroke-dasharray="78 440" transform="rotate(164)"/>
    <circle r="70" fill="none" stroke="#D48A6A" stroke-width="24" stroke-dasharray="48 440" transform="rotate(234)"/>
    <text y="6" text-anchor="middle" fill="#1D1B19" font-family="Georgia, serif" font-size="22" font-weight="700">100%</text>
  </g>

  <circle cx="90" cy="566" r="4.5" fill="#1A1918"/>
  <text x="106" y="570" fill="#5E564E" font-family="Inter, sans-serif" font-size="13">In-Clinic Care</text>
  <text x="372" y="570" fill="#1D1B19" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">39%</text>
  <circle cx="90" cy="596" r="4.5" fill="#6D9E83"/>
  <text x="106" y="600" fill="#5E564E" font-family="Inter, sans-serif" font-size="13">Telemedicine</text>
  <text x="372" y="600" fill="#1D1B19" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">29%</text>
  <circle cx="90" cy="626" r="4.5" fill="#E5C167"/>
  <text x="106" y="630" fill="#5E564E" font-family="Inter, sans-serif" font-size="13">Insurance Claims</text>
  <text x="372" y="630" fill="#1D1B19" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">21%</text>
  <circle cx="90" cy="656" r="4.5" fill="#D48A6A"/>
  <text x="106" y="660" fill="#5E564E" font-family="Inter, sans-serif" font-size="13">Emergency &amp; Urgent</text>
  <text x="372" y="660" fill="#1D1B19" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">11%</text>

  <!-- Card 2: D3 Semi-Circle Collection Gauge -->
  <rect x="453" y="290" width="374" height="384" rx="24" fill="#FFFEFC" stroke="#EAE3D7"/>
  <text x="483" y="330" fill="#1D1B19" font-family="Georgia, serif" font-size="18" font-weight="700">Collection Target</text>
  <text x="752" y="330" fill="#9A9186" font-family="'JetBrains Mono', monospace" font-size="11">Gauge</text>

  <g transform="translate(640, 488)">
    <path d="M -95 0 A 95 95 0 0 1 95 0" fill="none" stroke="#EFEAE1" stroke-width="24" stroke-linecap="round"/>
    <path d="M -95 0 A 95 95 0 0 1 32 -89" fill="none" stroke="#1E2D24" stroke-width="24" stroke-linecap="round"/>
    <path d="M 42 -85 A 95 95 0 0 1 76 -56" fill="none" stroke="#C7D36F" stroke-width="24" stroke-linecap="round"/>
    <line x1="60" y1="-44" x2="86" y2="-63" stroke="#C87D55" stroke-width="3" stroke-linecap="round"/>
    <text y="-8" text-anchor="middle" fill="#1D1B19" font-family="Georgia, serif" font-size="38" font-weight="700">86%</text>
    <text y="16" text-anchor="middle" fill="#8C8378" font-family="Inter, sans-serif" font-size="12">Settled invoices ratio</text>
