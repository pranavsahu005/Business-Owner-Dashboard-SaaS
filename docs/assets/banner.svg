<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Intelly Clinical Suite Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111114"/>
      <stop offset="55%" stop-color="#17161B"/>
      <stop offset="100%" stop-color="#1E1916"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="82%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#80CBC4" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#80CBC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="18%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#B06F4B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#B06F4B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B06F4B"/>
      <stop offset="50%" stop-color="#80CBC4"/>
      <stop offset="100%" stop-color="#EA80FC"/>
    </linearGradient>
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Main rounded container -->
  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#subtleGrid)"/>
  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#glowTeal)"/>
  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#glowWarm)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>

  <!-- Top accent rule -->
  <rect x="64" y="48" width="72" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- Kicker -->
  <text x="64" y="82" fill="#A8A29E" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="2.8">
    CLINICAL INTELLIGENCE &amp; PRACTICE OPERATIONS
  </text>

  <!-- Brand title -->
  <text x="64" y="148" fill="#FAF8F5" font-family="Georgia, 'Playfair Display', serif" font-size="56" font-weight="700" letter-spacing="-0.8">
    intelly
  </text>
  <circle cx="242" cy="138" r="6" fill="#EA80FC"/>
  <text x="266" y="148" fill="#D6D3D1" font-family="Georgia, 'Playfair Display', serif" font-size="42" font-weight="400" opacity="0.88">
    Clinical Suite
  </text>

  <!-- Subtitle -->
  <text x="64" y="192" fill="#A8A29E" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400">
    Unified executive billing, forward revenue forecasting, structured PDF/CSV reporting,
  </text>
  <text x="64" y="216" fill="#A8A29E" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400">
    interactive scheduling, clinical notes, and Gemini-assisted decision intelligence.
  </text>

  <!-- Bottom metadata strip -->
  <line x1="64" y1="248" x2="760" y2="248" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <text x="64" y="278" fill="#80CBC4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">REACT 19</text>
  <text x="144" y="278" fill="#57534E" font-family="Inter, sans-serif" font-size="12">/</text>
  <text x="162" y="278" fill="#E7E5E4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500">TYPESCRIPT</text>
  <text x="252" y="278" fill="#57534E" font-family="Inter, sans-serif" font-size="12">/</text>
  <text x="270" y="278" fill="#E7E5E4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500">TAILWIND V4</text>
  <text x="366" y="278" fill="#57534E" font-family="Inter, sans-serif" font-size="12">/</text>
  <text x="384" y="278" fill="#E7E5E4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500">EXPRESS + GEMINI API</text>
  <text x="556" y="278" fill="#57534E" font-family="Inter, sans-serif" font-size="12">/</text>
  <text x="574" y="278" fill="#F48FB1" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">PDF &amp; CSV EXPORTS</text>

  <!-- Right side minimal analytics graphic -->
  <g transform="translate(825, 48)">
    <rect x="0" y="0" width="315" height="224" rx="18" fill="#1C1B21" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="22" y="32" fill="#A8A29E" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">REVENUE &amp; FORECAST</text>
    <text x="22" y="60" fill="#FAF8F5" font-family="Georgia, serif" font-size="24" font-weight="700">$31,850</text>
    <text x="130" y="58" fill="#80CBC4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">+18.6% Q4</text>

    <!-- Subtle chart grid -->
    <line x1="22" y1="95" x2="293" y2="95" stroke="#FFFFFF" stroke-opacity="0.06" stroke-dasharray="3 3"/>
    <line x1="22" y1="130" x2="293" y2="130" stroke="#FFFFFF" stroke-opacity="0.06" stroke-dasharray="3 3"/>
    <line x1="22" y1="165" x2="293" y2="165" stroke="#FFFFFF" stroke-opacity="0.06" stroke-dasharray="3 3"/>

    <!-- Actual curve -->
    <path d="M 22 172 C 62 160, 88 140, 126 132 C 160 124, 186 108, 218 98" fill="none" stroke="#F48FB1" stroke-width="3" stroke-linecap="round"/>
    <!-- Forecast dashed curve -->
    <path d="M 218 98 C 245 90, 268 80, 293 70" fill="none" stroke="#80CBC4" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
    <circle cx="218" cy="98" r="4.5" fill="#F48FB1"/>
    <circle cx="293" cy="70" r="4.5" fill="#80CBC4"/>

    <!-- Footer labels -->
    <text x="22" y="200" fill="#78716C" font-family="'JetBrains Mono', monospace" font-size="10">ACTUAL</text>
    <text x="90" y="200" fill="#80CBC4" font-family="'JetBrains Mono', monospace" font-size="10">FORECAST</text>
    <text x="222" y="200" fill="#A8A29E" font-family="'JetBrains Mono', monospace" font-size="10">Q4 2026</text>
  </g>
</svg>
